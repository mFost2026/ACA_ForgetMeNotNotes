<!DOCTYPE html>
<html lang="en">
<link rel="icon" type="image/png" href="./image/favicon.png">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Latest compiled and minified CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <!-- jQuery library -->
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.slim.min.js"></script>
    <!-- Popper JS -->
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <!-- Latest compiled JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.6.9/angular.min.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.6.9/angular-route.js"></script>

    <title>Forget Me Not Tasks</title>

    <script src="./js/main.js"></script>
    <script src="./js/todoController.js"></script>
    <script src="./js/updateController.js"></script>
    <script src="./js/createController.js"></script>
    <script src="./js/searchController.js"></script>
</head>

<body ng-app="todoapp">
    <style>
        /* Global Reset: Allows sub-page assets to scale cleanly to browser boundaries */
        html,
        body {
            margin: 0 !important;
            padding: 0 !important;
            min-height: 100vh;
            background-color: #000000 !important;
            /* Flat backstop layout fallback */
        }

        /* Permanent Jet-Black Header Band wrapping custom navigation links */
        .retro-app-navbar {
            padding: 12px 30px !important;
            background-color: #000000 !important;
            /* FIXED: Forces header row to stay completely black on all views */
            border-top: 24px solid #000000 !important;
            /* Recreates top black frame perimeter segment */
            border-left: 24px solid #000000 !important;
            /* Recreates left black frame perimeter segment */
            border-right: 24px solid #000000 !important;
            /* Recreates right black frame perimeter segment */
            border-bottom: 4px solid #000000 !important;
            /* Main separation line underneath the links */
            width: 100% !important;
            box-sizing: border-box !important;
            margin: 0 !important;
            z-index: 1000;
        }

        /* Menu control links */
        .nav-link-retro {
            color: #000000 !important;
            font-size: 1.1rem !important;
            padding: 6px 14px !important;
            border: 2px solid #000000 !important;
            border-radius: 4px !important;
            background-color: #ffffff !important;
            box-shadow: 3px 3px 0px #000000 !important;
            transition: all 0.1s ease;
        }

        .nav-link-retro:hover {
            transform: translate(1px, 1px);
            box-shadow: 2px 2px 0px #000000 !important;
            background-color: #f7f7f7 !important;
        }
    </style>

    <!-- Permanent black layout background -->
    <nav class="navbar navbar-expand-lg navbar-light retro-app-navbar">
        <div class="collapse navbar-collapse d-flex justify-content-between align-items-center w-100">
            <!-- Left Link Route Group -->
            <div class="d-flex" style="gap: 15px;">
                <a class="nav-link font-weight-bold nav-link-retro" style="background-color: yellow !important;"
                    href="#!main">Forget Me Not Notes</a>
                <a class="nav-link font-weight-bold nav-link-retro" style="background-color: yellow !important;"
                    href="#!search">Search/Update Tasks</a>
                <a class="nav-link font-weight-bold nav-link-retro" style="background-color: yellow !important;"
                    href="#!create">Add Task</a>
            </div>
            <!-- Right Link Route Group -->
            <div class="d-flex" style="gap: 15px;">
                <a class="nav-link font-weight-bold nav-link-retro" style="background-color:turquoise !important;"
                    href="#!stack">Stack</a>
                <a class="nav-link font-weight-bold nav-link-retro" style="background-color:turquoise !important;"
                    href="#!resume">Resume</a>
            </div>
        </div>
    </nav>
    <!-- MAIN VIEWPORT CONTAINER SLOT: Content maps freely edge-to-edge -->
    <div ng-view></div>
</body>
