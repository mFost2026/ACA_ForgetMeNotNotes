<style>
  /* ======================================================== */
  /* GLOBAL STYLES (Applies to both Mobile and Desktop)       */
  /* ======================================================== */
  html,
  body {
    margin: 0 !important;
    padding: 0 !important;
    background-color: black !important;
    width: 100% !important;
  }

  .style-header {
    background-color: yellow !important;
    color: black !important;
    border: 2px solid black !important;
    border-bottom: 3px solid black !important;
    padding: 10px 15px !important;
  }

  .header-decor-bee {
    position: absolute !important;
    z-index: 1 !important;
    pointer-events: none !important;
    height: auto !important;
  }

  .app-body-frame {
    width: 100% !important;
    background-color: black !important;
    margin: 0 !important;
    padding: 0 !important;
  }

  .print-checkbox {
    transform: scale(1.2);
    cursor: pointer;
  }

  /* Compact Row Spacing Rules */
  .table-sm th,
  .table-sm td {
    padding: 2px 4px !important;
    line-height: 1.1 !important;
    font-size: 0.82rem !important;
    vertical-align: top !important;
  }

  .table-responsive td:nth-child(5) {
    max-width: 200px !important;
    white-space: normal !important;
    word-break: break-all !important;
  }

  /* ======================================================== */
  /* UNIFIED DESKTOP-ONLY LAYOUT (min-width: 992px)            */
  /* ======================================================== */
  @media (min-width: 992px) {

    html,
    body {
      height: 100% !important;
      max-height: 100vh !important;
      overflow: hidden !important;
      /* Locks window background bounce */
    }

    .desktop-fixed-window {
      height: 100vh !important;
      max-height: 100vh !important;
      display: flex !important;
      flex-direction: column !important;
      padding: 15px !important;
      box-sizing: border-box !important;
      position: relative !important;
      /* Creates absolute bounding anchor framework */
    }

    .style-header {
      border-top-left-radius: 12px !important;
      border-top-right-radius: 12px !important;
    }

    /* ABSOLUTE BOX TRICK: Locks lower row frame precisely inside screen limits */
    .app-body-frame {
      display: flex !important;
      position: absolute !important;
      left: 15px !important;
      right: 15px !important;
      top: 175px !important;
      /* Starts exactly underneath your header panel */
      bottom: 30px !important;
      /* SNAPS INSTANTLY 30px BEFORE THE BOTTOM SCREEN RIM */
      width: calc(100% - 30px) !important;
      height: auto !important;
      overflow: hidden !important;
    }

    .desktop-sync-height {
      height: 100% !important;
      max-height: 100% !important;
    }

    .desktop-square-img {
      width: 100% !important;
      height: 100% !important;
      object-fit: cover !important;
    }

    /* Independent Data Table Scrolling Boundaries */
    .table-responsive {
      overflow: hidden !important;
      position: relative !important;
      display: flex !important;
      flex-direction: column !important;
      height: 100% !important;
      min-height: 0 !important;
    }

    .table-responsive table {
      display: flex !important;
      flex-direction: column !important;
      height: 100% !important;
      width: 100% !important;
    }

    .table-responsive thead {
      display: block !important;
      width: 100% !important;
      flex-shrink: 0 !important;
    }

    .table-responsive thead tr {
      display: table !important;
      width: 100% !important;
      table-layout: fixed !important;
    }

    .table-responsive tbody {
      display: block !important;
      overflow-y: auto !important;
      overflow-x: hidden !important;
      flex: 1 !important;
      width: 100% !important;
      padding-bottom: 10px !important;
    }

    .table-responsive tbody tr {
      display: table !important;
      width: 100% !important;
      table-layout: fixed !important;
    }

    /* Custom Webkit Scrollbar Channels */
    .table-responsive tbody::-webkit-scrollbar {
      width: 10px !important;
    }

    .table-responsive tbody::-webkit-scrollbar-track {
      background: transparent !important;
    }

    .table-responsive tbody::-webkit-scrollbar-thumb {
      background-color: rgba(0, 0, 0, 0.4) !important;
      border-radius: 4px !important;
      border: 2px solid transparent !important;
    }

    .table-responsive tbody::-webkit-scrollbar-thumb:hover {
      background-color: rgba(0, 0, 0, 0.6) !important;
    }

    /* Invisible row push spacer spacer */
    .table-responsive tbody::after {
      content: "" !important;
      display: block !important;
      height: 5px !important;
      width: 100% !important;
      pointer-events: none !important;
    }
  }

  /* ======================================================== */
  /* MOBILE & TABLET LAYOUT (Fluid, natural stacked scrolling)*/
  /* ======================================================== */
  @media (max-width: 991px) {

    html,
    body {
      height: auto !important;
      max-height: none !important;
      overflow-y: auto !important;
    }

    .desktop-fixed-window {
      height: auto !important;
      max-height: none !important;
      padding: 10px !important;
    }

    .style-header {
      border-radius: 8px !important;
    }

    .desktop-square-img {
      width: 100% !important;
      max-height: 250px !important;
      object-fit: cover !important;
      margin-bottom: 15px;
    }

    .table-responsive {
      overflow-x: auto !important;
      overflow-y: visible !important;
    }
  }

  @media (max-width: 768px) {
    .header-decor-bee {
      display: none !important;
    }
  }

  /* ======================================================== */
  /* PRINT TASKS                                              */
  /* ======================================================== */
  #invisible-print-section {
    display: none !important;
  }

  @media print {

    body>div.desktop-fixed-window,
    .desktop-fixed-window,
    .desktop-fixed-window *,
    .style-header,
    .app-body-frame,
    .table-responsive,
    button,
    img {
      display: none !important;
      background: transparent !important;
      background-color: transparent !important;
      box-shadow: none !important;
      border: none !important;
    }

    html,
    body {
      background: white !important;
      background-color: white !important;
      color: black !important;
      height: auto !important;
      min-height: 0 !important;
      max-height: none !important;
      overflow: visible !important;
    }

    #invisible-print-section {
      display: block !important;
      background: white !important;
      color: black !important;
      width: 100% !important;
      position: absolute !important;
      left: 0 !important;
      top: 0 !important;
      padding: 0 !important;
      margin: 0 !important;
    }

    #invisible-print-section h1,
    #invisible-print-section .print-item-row,
    #invisible-print-section .print-item-title,
    #invisible-print-section .print-item-meta,
    #invisible-print-section .print-item-note {
      display: block !important;
      background: transparent !important;
      color: black !important;
    }

    .print-heading {
      font-family: Arial, sans-serif !important;
      font-size: 22px !important;
      font-weight: bold !important;
      border-bottom: 2px solid #000000 !important;
      padding-bottom: 6px !important;
      margin-bottom: 20px !important;
      text-transform: uppercase !important;
    }

    .print-item-row {
      border-bottom: 1px dashed #777777 !important;
      padding: 12px 0 !important;
      page-break-inside: avoid !important;
    }

    .print-item-title {
      font-family: Arial, sans-serif !important;
      font-weight: bold !important;
      font-size: 16px !important;
      margin-bottom: 4px;
    }

    .print-item-meta {
      font-family: Arial, sans-serif !important;
      font-size: 13px !important;
      color: #222222 !important;
      margin-bottom: 4px !important;
      line-height: 1.4 !important;
    }

    .print-item-note {
      font-family: Arial, sans-serif !important;
      font-style: italic !important;
      font-size: 13px !important;
      color: #333333 !important;
      background: #f9f9f9 !important;
      padding: 5px 10px !important;
      border-left: 4px solid #444444 !important;
      margin-top: 5px !important;
    }

    .print-manual-note {
      margin-top: 10px !important;
      border-bottom: 1px solid #999999 !important;
      height: 35px !important;
      width: 100% !important;
      display: block !important;
      background: transparent !important;
    }
  }
</style>

<!-- Outer Layout Wrapper -->
<div class="container-fluid desktop-fixed-window">
  <!-- Header Section with Decorative Bees -->
  <div class="w-100 style-header position-relative overflow-hidden">
    <!-- Precision Background Layer - Mapped to match image marker templates -->
    <img src="./image/bee_cute.png" alt="Bee" class="header-decor-bee"
      style="top: 32%; left: 3%; width: 45px; transform: rotate(-15deg);">
    <img src="./image/bee_cute.png" alt="Bee" class="header-decor-bee"
      style="top: 52%; left: 10%; width: 45px; transform: rotate(20deg) scaleX(-1);">
    <img src="./image/bee_cute.png" alt="Bee" class="header-decor-bee"
      style="top: 30%; left: 14%; width: 45px; transform: rotate(-45deg);">
    <img src="./image/bee_cute.png" alt="Bee" class="header-decor-bee"
      style="top: 50%; left: 23%; width: 45px; transform: rotate(15deg);">
    <img src="./image/bee_cute.png" alt="Bee" class="header-decor-bee"
      style="top: 15%; left: 31%; width: 45px; transform: rotate(-20deg);">
    <img src="./image/bee_cute.png" alt="Bee" class="header-decor-bee"
      style="top: 15%; left: 69%; width: 45px; transform: rotate(10deg) scaleX(-1);">
    <img src="./image/bee_cute.png" alt="Bee" class="header-decor-bee"
      style="top: 50%; left: 68%; width: 45px; transform: rotate(-35deg);">
    <img src="./image/bee_cute.png" alt="Bee" class="header-decor-bee"
      style="top: 32%; left: 76%; width: 45px; transform: rotate(25deg);">
    <img src="./image/bee_cute.png" alt="Bee" class="header-decor-bee"
      style="top: 12%; left: 84%; width: 45px; transform: rotate(-15deg) scaleX(-1);">
    <img src="./image/bee_cute.png" alt="Bee" class="header-decor-bee"
      style="top: 52%; left: 88%; width: 45px; transform: rotate(40deg);">
    <img src="./image/bee_cute.png" alt="Bee" class="header-decor-bee"
      style="top: 25%; left: 93%; width: 45px; transform: rotate(-10deg) scaleX(-1);">
    <!-- Main Content Header Text -->
    <h1 class="text-center font-weight-bold m-0 position-relative" style="font-size: calc(1.2rem + 0.8vw); z-index: 5;">
      Search Tasks</h1>
    <p class="text-center my-1 font-weight-bold position-relative"
      style="font-size: calc(0.9rem + 0.3vw); color: black; z-index: 5;">Please select a Task for update/delete or
      printing</p>
    <!-- Action Controls Row -->
    <div class="text-center mt-0 mb-1 position-relative" style="z-index: 5;">
      <button ng-click="getTodaysTodos();orderByColumn('id')" class="btn btn-sm font-weight-bold mx-2"
        style="color:black; background-color:yellow; box-shadow: 3px 3px rgba(0,0,0,0.3); border: 1px solid black;">Refresh
        Task List</button>
      <button ng-click="printSelectedTasks()" class="btn btn-sm font-weight-bold mx-2"
        style="color:black; background-color:yellow; box-shadow: 3px 3px rgba(0,0,0,0.3); border: 1px solid black;">Print
        Selected</button>
      <button ng-click="showCompleted = !showCompleted" class="btn btn-sm font-weight-bold mx-2"
        style="color:black; background-color:yellow; box-shadow: 3px 3px rgba(0,0,0,0.3); border: 1px solid black;"> {{
        showCompleted ? 'Hide Completed Tasks' : 'Show Completed Tasks' }} </button>
    </div>
    <!-- Live Search Input Box Container -->
    <div class="px-3 pb-2 mx-auto position-relative" style="max-width: 500px; z-index: 5;">
      <div class="input-group input-group-sm" style="box-shadow: 3px 3px rgba(0,0,0,0.3);">
        <div class="input-group-prepend">
          <span class="input-group-text font-weight-bold btn-sm py-1"
            style="color: black; background-color: yellow; border: 1px solid black; font-size: 0.875rem; border-right: 0;">Search:</span>
        </div>
        <input type="text" ng-model="searchKeyword" class="form-control font-weight-bold text-dark py-1"
          style="border: 1px solid black; font-size: 0.875rem; background-color: white; height: auto;"
          placeholder="Type to filter titles, types, or notes...">
      </div>
    </div>
  </div>
  <!-- Main Body Layout Split Frame -->
  <div class="row no-gutters w-100 m-0 app-body-frame"
    style="display: flex !important; max-height: calc(100vh - 285px) !important; height: calc(100vh - 205px) !important; overflow: hidden !important;">
    <!-- Left Column: Image Box -->
    <div class="col-lg-4 pt-2 pb-0 pr-2 pl-0 d-flex align-items-stretch"
      style="background-color: black !important; max-height: calc(100vh - 285px) !important; overflow: hidden !important;">
      <div style="width: 100%; height: 100%; max-height: 100%; overflow: hidden; border: 2px solid black;">
        <img class="img-fluid desktop-square-img" src="./image/forgetmeNotFlowers_search.jpg"
          alt="Forget Me Not Flowers" style="height: 100% !important; object-fit: cover !important;">
      </div>
    </div>
    <!-- Right Column: Table Box Container -->
    <div class="col-lg-8 pt-2 pb-0 pl-2 pr-0 d-flex flex-column desktop-sync-height"
      style="font-style: italic; background-color: black !important; max-height: 100%;">
      <div class="table-responsive" style="border: 2px solid black; background-color: yellow !important;">
        <!-- Table Responsive Wrapper (Forces Scroll Track back inside screen visibility boundaries) -->
        <div class="table-responsive desktop-sync-height"
          style="border: 2px solid black; background-color: yellow !important; height: 100%; overflow-y: auto !important;">
          <!-- Added fixed table layout system constraints to respect width percentages -->
          <table class="table table-sm table-hover table-striped table-bordered m-0"
            style="background-color: yellow !important; font-style: normal; table-layout: fixed; width: 100%;">
            <thead style="position: sticky; top: 0; background-color: black; z-index: 10;">
              <tr>
                <!-- Master Toggle Selection Header Column -->
                <th class="border-0 p-1 text-center" style="background-color: black; width: 8%;">
                  <button type="button" ng-click="toggleSelectAll()"
                    class="btn btn-sm font-weight-bold p-1 bg-transparent border-0"
                    style="color: yellow; font-size: 0.85rem;"> {{ allSelected ? 'Unselect' : 'Select All' }} </button>
                </th>
                <th class="border-0 p-1 text-center" style="background-color: black; width: 22%;">
                  <button type="button" ng-click="orderByColumn('title')"
                    class="btn btn-md btn-block font-weight-bold bg-transparent border-0"
                    style="color: yellow;">Title</button>
                </th>
                <th class="border-0 p-1 text-center" style="background-color: black; width: 18%;">
                  <button type="button" ng-click="orderByColumn('listtype')"
                    class="btn btn-md btn-block font-weight-bold bg-transparent border-0" style="color: yellow;">Task
                    Type</button>
                </th>
                <th class="border-0 p-1 text-center" style="background-color: black; width: 18%;">
                  <button type="button" ng-click="orderByColumn('startDate')"
                    class="btn btn-md btn-block font-weight-bold text-nowrap bg-transparent border-0"
                    style="color: yellow;">Start Date</button>
                </th>
                <th class="border-0 p-1 text-center" style="background-color: black; width: 24%;">
                  <button type="button" ng-click="orderByColumn('note')"
                    class="btn btn-md btn-block font-weight-bold bg-transparent border-0"
                    style="color: yellow;">Note</button>
                </th>
                <th class="border-0 p-1 text-center" style="background-color: black; width: 10%;">
                  <button type="button" ng-click="orderByColumn('done')"
                    class="btn btn-md btn-block font-weight-bold bg-transparent border-0"
                    style="color: yellow;">Completed?</button>
                </th>
              </tr>
            </thead>
            <tbody ng-show="!showSpinner" class="font-weight-bold text-dark" style="font-size: 0.9rem;">
              <tr
                ng-repeat="todo in todos | orderBy:orderByValue:reverse | filter:(showCompleted ? '' : {done: false}) | filter:searchKeyword track by todo.id"
                ng-click="goToUpdateView(todo.id)">
                <td class="py-1 text-center align-top" ng-click="$event.stopPropagation()">
                  <input type="checkbox" class="print-checkbox mt-1" ng-model="todo.selectedForPrint">
                </td>
                <td class="py-1 align-top">{{todo.title}}</td>
                <td class="py-1 align-top">{{todo.listtype}}</td>
                <td class="py-1 align-top text-nowrap">{{todo.startDate}}</td>
                <!-- Note Data Cell: Added auto-wrap layout protections to stop horizontal overflow bugs -->
                <td class="py-1 align-top"
                  style="white-space: normal !important; word-break: break-word !important; overflow-wrap: break-word !important;">
                  {{todo.note}}</td>
                <td class="py-1 align-top" ng-class="{'text-success': todo.done}"> {{todo.done ? 'Yes' : 'No'}} </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
